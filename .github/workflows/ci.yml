name: CI - Testes e Qualidade

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Testes Unitários e Integridade
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Executar suíte de testes com pytest
        env:
          NVIDIA_API_KEY: "ci-mock-key"
          ASCLEPIO_DB_PATH: ":memory:"
        run: |
          pytest -v tests/

      - name: Executar runner integrado independente
        env:
          NVIDIA_API_KEY: "ci-mock-key"
          ASCLEPIO_DB_PATH: ":memory:"
        run: |
          python tests/run_tests.py

      - name: Validação de sintaxe Python
        run: |
          python -m compileall -q .
