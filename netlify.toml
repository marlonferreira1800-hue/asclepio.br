[build]
  publish = "frontend"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/atendimentos"
  to = "/.netlify/functions/atendimentos"
  status = 200

[[redirects]]
  from = "/api/atendimento"
  to = "/.netlify/functions/atendimento"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
